name: Claude Implement Feature

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-do-feature-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement-feature:
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@claude do feature') &&
      !github.event.issue.pull_request &&
      contains(vars.CLAUDE_ALLOWED_USERS, github.event.comment.user.login)

    steps:
      - name: Acknowledge trigger
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Checkout ikary-worker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ikary-worker

      - name: Checkout ikary-manifest (linked packages)
        uses: actions/checkout@v4
        with:
          repository: ikary-platform/ikary-manifest
          path: ikary-manifest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ikary-worker/.nvmrc
          cache: pnpm
          cache-dependency-path: ikary-worker/pnpm-lock.yaml

      - name: Install manifest dependencies
        working-directory: ikary-manifest
        run: pnpm install --frozen-lockfile

      - name: Install worker dependencies
        working-directory: ikary-worker
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch_prefix: "claude/"
          show_full_output: true
          working_directory: ikary-worker
          claude_args: >
            --model claude-sonnet-4-6
            --max-turns 50
            --dangerously-skip-permissions
          prompt: |
            Implement the feature described in this issue. Follow all rules in CLAUDE.md.

            IKARY convention files you should consult:
            - LIBRARY_STYLE_RULES.md — microPackageKind, folder layout, system-*/worker-* naming, Zod, Kysely, export surface
            - LIBRARY_TEMPLATE.md — folder blueprint, export conventions, vitest config template
            - CLAUDE.md — top-level project rules (DI, testing, Zod contracts)

            1. Find the feature plan in the comments (## Feature Plan heading). Follow it step by step.
            2. If no plan exists, implement from the issue description directly.
            3. Run pnpm run build, pnpm run typecheck, and pnpm run test before creating the PR.
            4. Maintain 100% coverage for libs/* packages and 90% for apps/worker.

            PR FORMAT:
            - Title: feat(<scope>): <description>
            - Body: no emojis, no em-dashes, active voice
            - Include "Closes #<issue-number>"
